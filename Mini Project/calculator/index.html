<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Glass Calculator</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
    </div>

    <div class="calculator">

        <div class="top">

            <h2>Calculator</h2>

            <button id="themeBtn" title="Dark Mode">
                🌙
            </button>

        </div>

        <div class="display-area">

            <div id="history" class="history">
                History
            </div>

            <input
                type="text"
                id="display"
                placeholder="0"
                readonly>

        </div>

        <div class="buttons">

            <!-- Row 1 -->

            <button class="operator" onclick="clearDisplay()">AC</button>

            <button class="operator" onclick="deleteLast()">
                DEL
            </button>

            <button class="operator" onclick="appendValue('%')">
                %
            </button>

            <button class="operator" onclick="appendValue('/')">
                ÷
            </button>

            <!-- Row 2 -->

            <button onclick="appendValue('7')">
                7
            </button>

            <button onclick="appendValue('8')">
                8
            </button>

            <button onclick="appendValue('9')">
                9
            </button>

            <button class="operator" onclick="appendValue('*')">
                ×
            </button>

            <!-- Row 3 -->

            <button onclick="appendValue('4')">
                4
            </button>

            <button onclick="appendValue('5')">
                5
            </button>

            <button onclick="appendValue('6')">
                6
            </button>

            <button class="operator" onclick="appendValue('-')">
                −
            </button>

            <!-- Row 4 -->

            <button onclick="appendValue('1')">
                1
            </button>

            <button onclick="appendValue('2')">
                2
            </button>

            <button onclick="appendValue('3')">
                3
            </button>

            <button class="operator" onclick="appendValue('+')">
                +
            </button>

            <!-- Row 5 -->

            <button class="zero" onclick="appendValue('0')">
                0
            </button>

            <button onclick="appendValue('.')">
                .
            </button>

            <button class="equal" onclick="calculate()">
                =
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
